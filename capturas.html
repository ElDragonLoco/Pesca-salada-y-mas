<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Capturas - Pesca Salada y Más</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0b132b; color: #f4f7f6; }
        header { background: linear-gradient(135deg, #1c2541, #0b132b); text-align: center; padding: 2rem 1rem; border-bottom: 3px solid #48cae4; }
        header h1 { margin: 0; font-size: 2.5rem; color: #48cae4; }
        nav { background-color: #1c2541; text-align: center; padding: 1rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        nav a { color: #f4f7f6; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 1.1rem; }
        nav a:hover, nav a.active { color: #48cae4; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .pescometro { background: #1c2541; padding: 1.5rem; border-radius: 12px; margin-bottom: 3rem; border: 1px solid #3a506b; }
        .pescometro h2 { margin-top: 0; color: #95d5b2; text-align: center; }
        .podio { display: flex; justify-content: center; gap: 2rem; align-items: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }
        .podio-item { background: #0b132b; padding: 1rem; border-radius: 8px; text-align: center; width: 180px; border-top: 4px solid #48cae4; }
        .podio-item.primero { border-top-color: #ffd700; transform: scale(1.05); }
        .podio-item.segundo { border-top-color: #c0c0c0; }
        .medalla { font-size: 1.5rem; display: block; margin-bottom: 0.5rem; }
        .galeria-capturas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .pez-card { background: #1c2541; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .pez-img { width: 100%; height: 220px; object-fit: cover; background-color: #3a506b; }
        .pez-info { padding: 1.5rem; }
        .pez-info h3 { margin: 0 0 0.8rem 0; color: #48cae4; font-size: 1.4rem; border-bottom: 1px solid #3a506b; padding-bottom: 0.5rem; }
        .pez-detalles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.9rem; }
        .pez-detalles span { color: #a5a5a5; }
        .pez-detalles strong { color: white; text-transform: capitalize; }
        footer { text-align: center; padding: 2rem; background-color: #0b132b; color: #5c677d; border-top: 1px solid #1c2541; margin-top: 4rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header><h1>Diario de Capturas</h1></header>
    <nav>
        <a href="index.html">El Arsenal (Equipos)</a>
        <a href="capturas.html" class="active">Mis Capturas</a>
        <a href="mapa.html">Mapa de Pesca</a>
    </nav>
    <div class="container">
        <section class="pescometro">
            <h2>🏆 El Pescómetro (Mayores Piezas)</h2>
            <div class="podio" id="podio-records"><p>Calculando tus récords...</p></div>
        </section>
        <h2>Todas las Jornadas Registradas</h2>
        <main class="galeria-capturas" id="contenedor-capturas"><p>Conectando con el diario de abordo...</p></main>
    </div>
    <footer><p>&copy; 2026 Pesca Salada y Más</p></footer>

    <script>
        const SUPABASE_URL = "https://gvycmttihglhveiblmdl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FV0Fr-Yg-eEHl5_tzjxgWw_7IqmiLg7";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cargarCapturas() {
            try {
                const { data: capturas, error } = await _supabase.from('capturas').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                renderizarPescometro(capturas);
                renderizarGaleria(capturas);
            } catch (err) {
                document.getElementById('contenedor-capturas').innerHTML = "<p>Error: " + err.message + "</p>";
            }
        }

        function renderizarPescometro(lista) {
            const contenedor = document.getElementById('podio-records');
            if (!lista || lista.length === 0) { contenedor.innerHTML = "<p>Esperando tu primer gran récord en la base de datos.</p>"; return; }
            const ordenados = [...lista].sort((a, b) => parseFloat(b.peso) - parseFloat(a.peso));
            contenedor.innerHTML = "";
            if(ordenados[0]) {
                contenedor.innerHTML += `<div class="podio-item primero"><span class="medalla">🥇 Récord</span><strong>${ordenados[0].especie}</strong><div style="color: #ffd700; font-size: 1.3rem; font-weight:bold; margin-top:5px;">${ordenados[0].peso}</div></div>`;
            }
            if(ordenados[1]) {
                contenedor.innerHTML += `<div class="podio-item segundo"><span class="medalla">🥈 2º Puesto</span><strong>${ordenados[1].especie}</strong><div style="color: #c0c0c0; font-weight:bold; margin-top:5px;">${ordenados[1].peso}</div></div>`;
            }
        }

        function renderizarGaleria(lista) {
            const contenedor = document.getElementById('contenedor-capturas');
            if (!lista || lista.length === 0) { contenedor.innerHTML = "<p>No has añadido capturas todavía. ¡Toca estrenar el formulario!</p>"; return; }
            contenedor.innerHTML = "";
            lista.forEach(pez => {
                contenedor.innerHTML += `
                    <article class="pez-card">
                        <img class="pez-img" src="${pez.foto_url}" alt="${pez.especie}">
                        <div class="pez-info">
                            <h3>🐟 ${pez.especie}</h3>
                            <div class="pez-detalles">
                                <div><span>Peso:</span></div> <div><strong>${pez.peso}</strong></div>
                                <div><span>Zona:</span></div> <div><strong>${pez.lugar}</strong></div>
                                <div><span>Cebo:</span></div> <div><strong>${pez.cebo || 'No especificado'}</strong></div>
                                <div><span>Fecha:</span></div> <div><strong>${pez.fecha || 'Reciente'}</strong></div>
                            </div>
                        </div>
                    </article>`;
            });
        }
        cargarCapturas();
    </script>
</body>
</html>
